name: Release

# Publish a GitHub release (tag vX.Y.Z) and this workflow builds the card and
# attaches it as a release asset, which is where HACS looks first.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the build to, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version from tag
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - run: npm run build
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/bus-board-card.js
